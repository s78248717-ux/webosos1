<!DOCTYPE html>
<html>
<head>
    <meta charset ="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        My Web Os
    </title>
    <link rel = "stylesheet" href="style.css">
    
</head>
<body>
    
        
    <div class="taskbar">
     <button class="taskbar-icon" onclick="window.location.href='https://www.google.com'">🏠</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.drive.google.com/'">📁</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.wikipedia.org/'">🌐</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.settings.com/'">⚙️</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.youtube.com'">🎞️</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.github.com'">🐙</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.twitter.com'">🐦</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.reddit.com'">👽</button>
     <button class="taskbar-icon" onclick="window.location.href='https://www.discord.com'">💬</button>
     <div id="clock">00:00:00</div>
    </div>
   
    
    
    <script src = "script.js"></script>
</body>
</html>
